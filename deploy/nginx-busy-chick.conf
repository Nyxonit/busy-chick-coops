# Busy Chick Coops — nginx site.
# Installed by deploy/vps-up.sh. Listens on port 80 for the names in
# server_name. Does not set default_server, so an existing site on the
# same machine keeps answering requests that do not match these names.
server {
    listen 80;
    listen [::]:80;
    server_name busychickcoops.com www.busychickcoops.com projectchick.com www.projectchick.com;

    root /var/www/busy-chick-coops;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
